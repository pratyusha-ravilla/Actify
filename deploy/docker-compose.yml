# Actify — container stack (alternative to systemd + host Nginx)
#
#   docker compose up -d api web
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#     -d <DOMAIN> -d <WWW_DOMAIN> --agree-tos -m <ADMIN_EMAIL> --no-eff-email
#   docker compose up -d
#
# Replace <DOMAIN> / <WWW_DOMAIN> in deploy/nginx-docker.conf first.

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: [/etc/actify/api.env]
    volumes:
      - /var/lib/actify/uploads:/app/src/uploads
    expose: ["5002"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: "/api"
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on: [api]

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
