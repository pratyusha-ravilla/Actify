# Nginx vhost for the Docker stack (mounted at /etc/nginx/conf.d/default.conf).
# Replace <DOMAIN> / <WWW_DOMAIN>. Certbot's webroot challenge lives at /var/www/certbot.

limit_req_zone $binary_remote_addr zone=actify_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=actify_login:10m rate=10r/m;

upstream actify_api {
    server api:5002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN> <WWW_DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <DOMAIN> <WWW_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 120m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        limit_req zone=actify_api burst=40 nodelay;
        proxy_pass http://actify_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /api/auth/login    { limit_req zone=actify_login burst=5 nodelay; proxy_pass http://actify_api; }
    location = /api/auth/register { limit_req zone=actify_login burst=3 nodelay; proxy_pass http://actify_api; }
    location = /api/contact       { limit_req zone=actify_login burst=3 nodelay; proxy_pass http://actify_api; }

    location /uploads/ {
        limit_req zone=actify_api burst=60 nodelay;
        proxy_pass http://actify_api;
        proxy_set_header Host $host;
        expires 7d;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
